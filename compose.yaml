services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_agent
      POSTGRES_USER: crypto_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crypto_agent_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_agent -d crypto_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crypto_agent_pg:
